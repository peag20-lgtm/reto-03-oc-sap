# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: agente-oc-sap
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false # se ingresa en el panel de Render; nunca en el repositorio
      - key: APP_ACCESS_KEY
        sync: false
      - key: MAX_TOKENS_SESION
        value: "300000"
      - key: MAX_ITERACIONES
        value: "25"
