<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agente OC SAP</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/marked-15.0.12.min.js"></script>
  <script src="vendor/purify-3.2.6.min.js"></script>
</head>
<body>
  <header class="barra">
    <div>
      <h1>Agente de Órdenes de Compra SAP</h1>
      <p class="sub">Lee el paquete · valida RC1–RC10 · construye la OC · pide confirmación · crea en SAP simulado</p>
    </div>
    <div class="estado">
      <span id="modelo" class="chip">conectando…</span>
      <button id="nueva" class="sec" type="button">Nueva sesión</button>
    </div>
  </header>

  <main>
    <section id="chat" aria-live="polite"></section>

    <div id="confirmacion" class="confirmacion" hidden>
      <div>
        <strong>⏸️ El agente espera tu confirmación</strong>
        <span id="pendientes"></span>
      </div>
      <div class="acciones">
        <button id="si" type="button">Sí, confirmo</button>
        <button id="no" class="sec" type="button">No, no la crees</button>
      </div>
    </div>

    <div class="atajos" id="atajos"></div>

    <form id="form" class="entrada">
      <textarea id="mensaje" rows="2" maxlength="4000" placeholder='Ej.: Procesa la solicitud "sol-004". Muéstrame la OC y no la crees hasta que confirme.' required></textarea>
      <button id="enviar" type="submit">Enviar</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
